<body class="auth-body">
  <main class="auth-main" style="min-height:100vh">
    <div class="auth-card">
      <div class="card">
        <div class="card-pad verify-card">
          <div class="verify-mail-ic" id="mail-ic"></div>
          <div class="auth-head" style="margin-bottom:8px">
            <h1>Verify your email address</h1>
            <p>Before continuing, please confirm that <span class="verify-email-pill" id="email-pill">…</span> belongs to you.</p>
          </div>
          <p class="muted small">Open your inbox and click the verification link we sent you. Check your spam folder if you can't find it.</p>
          <div class="verify-status" id="verify-status">
            <span class="spin"></span><span>Checking verification status…</span>
          </div>
          <div class="verify-actions">
            <button class="btn btn-primary btn-block" id="check-btn">I've verified — check again</button>
            <button class="btn btn-ghost btn-block" id="resend-btn">Resend verification email</button>
            <p class="resend-note" id="resend-note" hidden></p>
            <button class="btn ghost btn-sm" id="change-email-btn" style="margin:0 auto">Use a different email address</button>
            <button class="btn ghost btn-sm" id="logout-btn" style="margin:0 auto; color:var(--ink-3)">Log out</button>
          </div>
        </div>
      </div>
    </div>
  </main>
